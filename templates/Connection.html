{% extends 'base.html' %}
{% block title %}Connexion | Club Mons{% endblock %}
{% block content %}
<section class="content-panel form-panel">
    <h1 class="page-heading">Espace membre</h1>
    <p class="page-intro">Connectez-vous pour accéder aux actualités réservées aux membres.</p>
    {% if msg %}<p class="form-message" role="status">{{ msg }}</p>{% endif %}
    <form action="{% url 'connection' %}" method="post" class="form-stack">
        {% csrf_token %}
        <label for="member-name">Nom ou prénom
            <input id="member-name" type="text" name="NomUsers" autocomplete="username" required>
        </label>
        <label for="member-password">Code vétéran ou mot de passe
            <input id="member-password" type="password" name="PassUsers" autocomplete="current-password" required>
        </label>
        <div class="form-actions">
            <button class="button-link" type="submit">Se connecter</button>
            <a href="{% url 'inscription' %}">Créer un compte</a>
        </div>
    </form>
</section>
{% endblock %}
