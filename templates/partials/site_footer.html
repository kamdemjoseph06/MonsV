{% load static %}
<footer class="site-footer" style="background-image: url('{% static 'staticImg/wave.svg' %}'), linear-gradient(155deg, #fff 50%, #ec4899 50%)">
    <div class="site-footer-inner">
        <a class="site-footer-logo" href="{% url 'accueil' %}" aria-label="Retour à l’accueil du Club Mons">
            <img src="{% static 'staticImg/LOGO.jpg' %}" alt="Logo du Club Mons">
        </a>
        <div class="site-footer-social" role="group" aria-label="Réseaux sociaux et contact du club">
            <span role="img" title="Facebook" aria-label="Facebook"><i class="fa fa-facebook ffb" aria-hidden="true"></i></span>
            <span role="img" title="WhatsApp" aria-label="WhatsApp"><i class="fa fa-whatsapp fwp" aria-hidden="true"></i></span>
            <span role="img" title="X" aria-label="X"><i class="fa fa-twitter ftwt" aria-hidden="true"></i></span>
            <span role="img" title="E-mail" aria-label="E-mail"><i class="fa fa-envelope fgm" aria-hidden="true"></i></span>
            <span role="img" title="YouTube" aria-label="YouTube"><i class="fa fa-youtube fytb" aria-hidden="true"></i></span>
        </div>
        <div class="site-footer-meta">
            <span>Copyright &copy; 2025</span>
            <span class="site-footer-credit">KFTJ <span aria-hidden="true">|</span> GMT</span>
        </div>
    </div>
</footer>
